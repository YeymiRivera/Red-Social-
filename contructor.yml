services:

  backend:
    image: redsocial
    build:
      context: ./Tarea4-Red Social grupo777
      dockerfile: Dockerfile
    expose:
      - "5290"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 5290
      REDIS_CONNECTION: redis:6379
      ConnectionStrings__Context: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-RedsocialDB};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}"
      FrontendUrl: "http://localhost:${FRONTEND_PORT:-5500}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
      DROPBOX_CLIENT_ID: "${DROPBOX_CLIENT_ID:-}"
      DROPBOX_CLIENT_SECRET: "${DROPBOX_CLIENT_SECRET:-}"
      FIGMA_CLIENT_ID: "${FIGMA_CLIENT_ID:-}"
      FIGMA_CLIENT_SECRET: "${FIGMA_CLIENT_SECRET:-}"
      TWITTER_CLIENT_ID: "${TWITTER_CLIENT_ID:-}"
      TWITTER_CLIENT_SECRET: "${TWITTER_CLIENT_SECRET:-}"
      TIKTOK_CLIENT_KEY: "${TIKTOK_CLIENT_KEY:-}"
      TIKTOK_CLIENT_SECRET: "${TIKTOK_CLIENT_SECRET:-}"
      TIKTOK_REDIRECT_URI: "${TIKTOK_REDIRECT_URI:-}"

    volumes:
      - claves-dataprotection:/root/.aspnet/DataProtection-Keys

    depends_on:
      redis:
        condition: service_healthy
      migraciones:
        condition: service_completed_successfully

    networks:
      - red-social
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - red-social

  migraciones:
    image: redsocial
    build:
      context: ./Tarea4-Red Social grupo777
      dockerfile: Dockerfile
    command: ["--migrar"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Context: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-RedsocialDB};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - red-social
  balanceador:
    image: nginx:alpine
    ports:
      - "${BACKEND_PORT:-5290}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - red-social

  frontend:
    image: redsocial-frontend
    build:
      context: ./Tarea4-Red Social grupo777/Frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-5500}:80"
    networks:
      - red-social

  postgres:
    image: postgres:17
    container_name: usuario-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-RedsocialDB}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-RedsocialDB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - red-social

volumes:
  datos-postgres:
    name: redsocial-datos-postgres

  claves-dataprotection:
    name: redsocial-claves-dataprotection

networks:
  red-social:
    driver: bridge
