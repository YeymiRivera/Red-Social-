services:

  backend:
    image: redsocial
    build:
      context: ./Tarea4-Red Social grupo777
      dockerfile: Dockerfile
    expose:
      - "5290"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 5290
      ConnectionStrings__Context: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-RedsocialDB};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-11ye}"
      FrontendUrl: "http://localhost:${FRONTEND_PORT:-5500}"
      Twitter__ClientId: "${TWITTER_CLIENT_ID:-RXdIX1BRb3lzSUpueXVza2FkQW06MTpjaQ}"
      Twitter__ClientSecret: "${TWITTER_CLIENT_SECRET:-zX1noBHXcpTEeY2c8JzJqmHlpRFcI2uJfn1HAQwzT12JpS1Emk}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-1031065320544-094ro9psb9o6k7m08puv7fca4lmcq9hk.apps.googleusercontent.com}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"

    volumes:
      - claves-dataprotection:/root/.aspnet/DataProtection-Keys

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - red-social

  balanceador:
    image: nginx:alpine
    ports:
      - "${BACKEND_PORT:-5290}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - red-social

  frontend:
    image: redsocial-frontend
    build:
      context: ./Tarea4-Red Social grupo777/Frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-5500}:80"
    networks:
      - red-social

  postgres:
    image: postgres:17
    container_name: usuario-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-RedsocialDB}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-11ye}
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-RedsocialDB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - red-social

volumes:
  datos-postgres:
    name: redsocial-datos-postgres

  claves-dataprotection:
    name: redsocial-claves-dataprotection

networks:
  red-social:
    driver: bridge
