<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Social - Iniciar sesión</title>
    <link rel="stylesheet" href="login.css">
    <style>
        body {
            font-family: sans-serif;
            max-width: 480px;
            margin: 50px auto;
            text-align: center;
        }

        button,
        a.btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            text-decoration: none;
            cursor: pointer;
            box-sizing: border-box;
        }

        .dropbox {
            background: #0061FF;
        }

        .figma {
            background: #A259FF;
        }

        .logout {
            background: #d9534f;
        }

        #perfil {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            text-align: left;
            background: #f9f9f9;
        }
    </style>
</head>

<body>

    <main class="contenedor">
        <section class="login">
            <h1>Red Social</h1>
            <p>Inicia sesión para formar parte de nuestra comunidad.</p>

            <button id="googleLogin">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                Continuar con Google
            </button>
            <button id="githubLogin">
                <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="GitHub">
                Continuar con GitHub
            </button>
            <a class="btn dropbox" href="http://localhost:5290/api/Auth/dropbox/login">Iniciar sesión con Dropbox</a>
            <a class="btn figma" href="http://localhost:5290/api/Auth/figma/login">Iniciar sesión con Figma</a>

            <div id="perfil">Verificando sesión...</div>
            <button class="logout" onclick="cerrarSesion()">Cerrar sesión</button>
            <p class="informacion" id="mensaje">
                Al continuar, podrás iniciar sesión o crear una cuenta.
            </p>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
